<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Prescrição Pediátrica</title>
  <link rel="stylesheet" href="./style.css?v=13">
</head>
<body>
  <header class="topbar">
    <h1>Prescrição Pediátrica</h1>
    <button id="newPrescriptionBtn" type="button" class="btn">Nova Prescrição</button>
  </header>

  <main class="layout">
    <!-- ── Left column: form ───────────────────────────────────────── -->
    <section aria-label="Formulário de prescrição">
      <div class="panel">
        <h2>Paciente</h2>
        <form id="patientForm" autocomplete="off" onsubmit="return false;">
          <div class="field">
            <label for="patientName">Nome do Paciente</label>
            <input id="patientName" name="patientName" type="text" required autocomplete="off" inputmode="text">
            <div class="field-error" id="errName"></div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="patientWeight">Peso (kg)</label>
              <input id="patientWeight" name="patientWeight" type="number" min="0.5" max="100" step="0.1" required inputmode="decimal">
              <div class="field-error" id="errWeight"></div>
            </div>
            <div class="field">
              <label for="patientDob">Data de Nascimento</label>
              <input id="patientDob" name="patientDob" type="date">
              <div class="field-error" id="errDob"></div>
              <div class="age-display" id="ageDisplay" aria-live="polite"></div>
            </div>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Adicionar Medicação</h2>
        <div class="med-select-row">
          <input id="medicationSearch" type="text" placeholder="Buscar por nome ou categoria…" autocomplete="off" aria-label="Buscar medicação">
          <button id="addMedBtn" type="button" class="btn btn-primary" disabled>Adicionar</button>
        </div>
        <ul id="medicationList" class="med-list" role="listbox" aria-label="Medicações disponíveis"></ul>
      </div>

      <div class="panel">
        <h2>Medicações da Prescrição</h2>
        <ul id="selectedList" class="selected-list"></ul>
      </div>

      <div class="action-footer">
        <button id="generateBtn" type="button" class="btn btn-primary btn-block" disabled title="Adicione paciente e medicações">
          Gerar PDF
        </button>
      </div>
    </section>

    <!-- ── Right column: preview ───────────────────────────────────── -->
    <section aria-label="Pré-visualização">
      <div class="panel preview-wrap">
        <div class="preview-header">
          <h2>Pré-visualização</h2>
          <span id="previewStatus" class="preview-status muted"></span>
        </div>
        <div id="previewPages" class="preview-pages" aria-label="Prescrição"></div>
      </div>
    </section>
  </main>

  <!-- ── First-time medication modal ──────────────────────────────── -->
  <dialog id="firstTimeModal" aria-labelledby="firstTimeTitle">
    <div class="modal-header">
      <h2>Confirme os parâmetros</h2>
      <div class="modal-sub" id="firstTimeTitle"></div>
    </div>
    <div class="modal-body">
      <div id="ftFixedNotice" style="display:none;"></div>
      <div class="field" id="ftPresentationField" style="display:none;">
        <label for="ftPresentation">Apresentação</label>
        <input id="ftPresentation" type="text" placeholder="Ex: 250mg/5ml suspensão oral">
      </div>
      <div class="field-row" id="ftConcRouteRow" style="display:none;">
        <div class="field">
          <label for="ftConcentration">Concentração (mg/ml)</label>
          <input id="ftConcentration" type="number" step="0.01" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="ftRoute">Via</label>
          <select id="ftRoute">
            <option value="Oral">Oral</option>
            <option value="Inalatório">Inalatório</option>
            <option value="Tópico">Tópico</option>
            <option value="Sublingual">Sublingual</option>
            <option value="Retal">Retal</option>
            <option value="Nasal">Nasal</option>
            <option value="Oftálmica">Oftálmica</option>
            <option value="Otológica">Otológica</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="field" id="ftDoseField">
        <label for="ftDose">Dose (mg/kg/dia)</label>
        <input id="ftDose" type="number" step="0.1" min="0" inputmode="decimal">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ftFrequency">Frequência (x/dia)</label>
          <select id="ftFrequency">
            <option value="1">1 (24/24h)</option>
            <option value="2">2 (12/12h)</option>
            <option value="3">3 (8/8h)</option>
            <option value="4">4 (6/6h)</option>
            <option value="6">6 (4/4h)</option>
          </select>
        </div>
        <div class="field">
          <label for="ftDuration">Duração (dias)</label>
          <input id="ftDuration" type="number" step="1" min="1" max="60" inputmode="numeric">
        </div>
      </div>
      <div class="field" id="ftMaxField">
        <label for="ftMaxDose">Dose máxima (mg/dia)</label>
        <input id="ftMaxDose" type="number" step="1" min="0" inputmode="numeric">
      </div>
    </div>
    <div class="modal-actions">
      <button id="ftCancel" type="button" class="btn">Cancelar</button>
      <button id="ftConfirm" type="button" class="btn btn-primary">Confirmar</button>
    </div>
  </dialog>

  <!-- ── Max dose exceeded modal ──────────────────────────────────── -->
  <dialog id="maxDoseModal" aria-labelledby="maxDoseTitle">
    <div class="modal-header">
      <h2 id="maxDoseTitle">⚠️ Atenção: dose máxima excedida</h2>
    </div>
    <div class="modal-body" id="mdBody"></div>
    <div class="modal-actions stacked">
      <button id="mdUseMax" type="button" class="btn btn-warning"></button>
      <button id="mdKeep" type="button" class="btn">Manter dose calculada</button>
      <button id="mdCancel" type="button" class="btn">Cancelar</button>
    </div>
  </dialog>

  <!-- ── Libraries ─────────────────────────────────────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- ── App scripts ───────────────────────────────────────────────── -->
  <script src="./pdf-overlay.js?v=13"></script>
  <script src="./app.js?v=13"></script>
</body>
</html>
